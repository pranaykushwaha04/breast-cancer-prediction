name: Deploy to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Create Deployment ZIP
        run: zip -r deploy.zip application.py requirements.txt templates/ static/ model.joblib scaler.joblib feature_names.joblib

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: breast-cancer-model-app
          environment_name: Breast-cancer-model-app-env
          version_label: "v-${{ github.sha }}"
          region: us-east-1
          deployment_package: deploy.zip
